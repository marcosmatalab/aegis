version: 2

# Weekly, across all three ecosystems this repo actually has. The npm entry is the
# one that matters most: the dashboard shipped 8 advisories (1 critical in `next`)
# for months with nothing watching, and `npm audit --audit-level=high` is now a
# blocking CI job — so an unattended dependency drift turns the build red rather
# than sitting there unnoticed.
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR for the dev toolchain instead of five. Production deps stay
      # individual, because those are the ones worth reading one at a time.
      dev-tooling:
        patterns: ["pytest*", "ruff", "mypy", "import-linter", "httpx"]

  - package-ecosystem: npm
    directory: "/dashboard"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # react and react-dom must be the exact same version or React refuses to render,
      # and @types/react-dom peers on a matching @types/react. Split one-per-PR, both
      # halves failed CI (#47, #49). Listed first: a dependency joins the first group
      # it matches, so @types/react lands here and not in dev-tooling.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      dev-tooling:
        patterns: ["@biomejs/*", "@testing-library/*", "@types/*", "vitest", "jsdom", "typescript"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
    groups:
      # Action bumps touch the same few workflow lines; one PR instead of four
      # (#41, #42, #44, #45 each needed its own rebase and CI run).
      actions:
        patterns: ["*"]

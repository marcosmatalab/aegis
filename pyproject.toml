[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The repo, the package directory and the CLI are all still "aegis"; only the
# DISTRIBUTION name differs, because `aegis` on PyPI belongs to someone else
# (as do aegis-gateway and aegis-llm). "control plane" is how the project
# describes itself in its own headline, so the name is descriptive, not a patch.
name = "aegis-control-plane"
version = "0.1.2"
description = "A reliability + security + governance gateway for LLMs and agents (OpenAI-compatible proxy)."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Marcos Mata García" }]
keywords = ["llm", "guardrails", "evals", "red-team", "owasp", "ai-governance", "gateway"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "httpx>=0.27",
    "ruff>=0.7",
    # Type + architecture gates. Both run in CI and both are blocking: mypy catches
    # the str-into-Literal class of bug, import-linter pins the layering that broke
    # the old gateway <-> guardrails cycle (see .importlinter).
    "mypy>=1.13",
    "import-linter>=2.1",
    # OTel API + SDK only (NOT the OTLP exporter): pure-python, keyless, no network,
    # so CI exercises the real GenAI span path + the CLEAR telemetry bridge fully
    # OFFLINE via the in-memory exporter — and still hits the "exporter=otlp but the
    # OTLP package is absent => clean config error" branch (the exporter ships only
    # in the [otel] extra below).
    "opentelemetry-api>=1.38",
    "opentelemetry-sdk>=1.38",
    # F8 governance evidence PDF. fpdf2 is pure-Python (only binary dep is Pillow,
    # which ships wheels — no system libs, no network at render time, core fonts
    # built in). In [dev] so CI exercises the PDF render path fully offline.
    "fpdf2>=2.8",
]
# Optional richer PII engine (F2). The deterministic regex engine is the default
# and needs none of this. Presidio also requires a spaCy model at runtime, e.g.
# `python -m spacy download en_core_web_sm`.
guardrails = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
]
# Optional real provider SDK (Anthropic / Claude). Lazy-imported only when
# AEGIS_DEFAULT_PROVIDER=anthropic; the gateway runs on the deterministic mock
# without it. CI installs only [dev], so the unit suite stays green with no SDK
# and no API key (the one live test self-skips).
anthropic = [
    "anthropic>=0.40",
]
# Optional OpenTelemetry observability (F1.x). OFF by default (AEGIS_OTEL_ENABLED);
# the gateway is a byte-identical F1 passthrough without it. api+sdk give in-process
# GenAI spans with NO collector; the OTLP/proto-http exporter (for an OTLP collector
# or Langfuse) is included here and lazy-imported only when AEGIS_OTEL_EXPORTER=otlp,
# so the default install never pulls protobuf and never touches the network.
otel = [
    "opentelemetry-api>=1.38",
    "opentelemetry-sdk>=1.38",
    "opentelemetry-exporter-otlp-proto-http>=1.38",
]
# Optional governance evidence PDF (F8). `aegis evidence` builds a partial-technical-
# evidence PDF from the real eval/red-team/calibration reports + effective config.
# fpdf2 is pure-Python (core fonts, no system libs, no network); lazy-imported only by
# the renderer, so the default install and the `--format json` path never need it.
reporting = [
    "fpdf2>=2.8",
]

[project.scripts]
aegis = "aegis.cli:main"

[project.urls]
Homepage = "https://github.com/marcosmatalab/aegis"
Repository = "https://github.com/marcosmatalab/aegis"
Issues = "https://github.com/marcosmatalab/aegis/issues"
Changelog = "https://github.com/marcosmatalab/aegis/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

# The frozen calibration verdicts ship INSIDE the wheel as well as living at the
# repo root. The README tells a reader to `pipx install aegis-control-plane` and
# then recompute the headline kappa — that has to work with no checkout, so the
# evidence has to travel with the package. One source file, two destinations:
# artifacts/ is where a reviewer looks, _artifacts/ is where the CLI falls back to.
[tool.hatch.build.targets.wheel.force-include]
"artifacts/calibration-geval-2026-09-22.jsonl" = "aegis/evals/calibration/_artifacts/calibration-geval-2026-09-22.jsonl"

[tool.hatch.build.targets.sdist]
# Without an explicit allow-list the sdist sweeps up the whole working tree —
# dashboard/node_modules, dashboard/.next (whose dev lock file is not even
# readable while the dev server runs), .venv and every report. Ship the things a
# consumer can actually use: the package, its tests, and the committed evidence
# behind the numbers in the README.
include = [
    "/src",
    "/tests",
    "/artifacts",
    "/scripts",
    "/docs/*.md",
    "/README.md",
    "/README.es.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
    "/.importlinter",
]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are called in argument defaults by design (B008).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.coverage.run]
source = ["src/aegis"]
branch = true

[tool.coverage.report]
# Branch coverage was already 96% before this gate existed — the gate is here to
# stop it SLIDING, not to chase a number. 95 is deliberately just under the real
# figure: tight enough that deleting a test file goes red, loose enough that one
# refactor does not.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '\.\.\.',
]

[tool.mypy]
python_version = "3.12"
files = ["src/aegis"]
# Not --strict: that is 68 errors across 24 files, and the last 80% of that cost
# buys very little signal here. This setting is the useful middle — it catches the
# real class of bug in this codebase (a plain `str` flowing into a `Literal` field,
# an Optional reaching a non-Optional parameter) without a rewrite.
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true

# The OPTIONAL extras, and only them. The Anthropic SDK ([anthropic]), Presidio
# ([guardrails]) and the OTLP exporter ([otel]) are all lazy-imported behind a
# feature flag and are deliberately absent from the default install that CI uses,
# so "no stub found" is the expected state, not a gap to paper over. Scoped
# per-module so a missing stub anywhere ELSE is still a hard error.
[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "presidio_analyzer.*",
    "presidio_anonymizer.*",
    "opentelemetry.exporter.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
